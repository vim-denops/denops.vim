name: Dependency Review

# The dependencies a pull request changes, checked against the GitHub
# Advisory Database: a pull request that adds a vulnerable one fails.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@v5.0.0
