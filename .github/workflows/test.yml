name: Test

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "!**.txt"
  workflow_dispatch:
    inputs:
      verbose:
        type: boolean
        required: false
        description: "Enable verbose output"
        default: false

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  DENOPS_TEST_VERBOSE: ${{ github.event.inputs.verbose }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
        deno_version:
          - "2.x"
    runs-on: ${{ matrix.runner }}
    steps:
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "${{ matrix.deno_version }}"
      - name: Lint check
        if: ${{ !cancelled() }}
        run: deno lint
      - name: Format check
        if: ${{ !cancelled() }}
        run: deno fmt --check
      - name: Type check
        if: ${{ !cancelled() }}
        run: deno task check
      - name: Doc check
        if: ${{ !cancelled() }}
        run: deno task check:doc
      - name: Supported version inconsistency check
        if: ${{ !cancelled() }}
        run: |
          git checkout .
          deno task apply:supported-versions
          git diff --exit-code

  test:
    needs: check

    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - macos-latest
          - ubuntu-latest
        deno_version:
          - "2.3.0"
          - "2.x"
        host_version:
          - vim: "v9.1.1646"
            nvim: "v0.11.3"

    runs-on: ${{ matrix.runner }}

    steps:
      - run: git config --global core.autocrlf false
        if: runner.os == 'Windows'

      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "${{ matrix.deno_version }}"

      - uses: rhysd/action-setup-vim@v1.6.1
        id: vim
        with:
          version: "${{ matrix.host_version.vim }}"

      - uses: rhysd/action-setup-vim@v1.6.1
        id: nvim
        with:
          neovim: true
          version: "${{ matrix.host_version.nvim }}"

      - name: Export executables
        run: |
          echo "DENOPS_TEST_VIM_EXECUTABLE=${{ steps.vim.outputs.executable }}" >> "$GITHUB_ENV"
          echo "DENOPS_TEST_NVIM_EXECUTABLE=${{ steps.nvim.outputs.executable }}" >> "$GITHUB_ENV"

      - name: Perform pre-cache
        run: deno cache ./denops/@denops-private/mod.ts

      - name: Test
        run: deno task test:coverage
        env:
          DENOPS_TEST_DENOPS_PATH: "./"
        timeout-minutes: 10
        continue-on-error: true

      - run: |
          deno task coverage --lcov > coverage.lcov
        continue-on-error: true

      - uses: codecov/codecov-action@v4.6.0
        with:
          os: ${{ runner.os }}
          files: ./coverage.lcov
          token: ${{ secrets.CODECOV_TOKEN }}
